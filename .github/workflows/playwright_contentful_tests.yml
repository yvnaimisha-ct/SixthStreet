---
name: Playwright Contentful Tests
on:
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers
        run: npx playwright install
      - name: Cleanup Allure folders
        run: |
          rm -rf ./playwright/reports/api/allure-report
          rm -rf ./playwright/reports/api/allure-results
      - name: Debug env vars
        run: |
          echo "SPACE_ID=$CONTENTFUL_SPACE_ID"
          echo "ENV=$CONTENTFUL_ENV"
          echo "TOKEN_SET=${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN != '' }}"
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_MANAGEMENT_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}
          CONTENTFUL_ENV: ${{ secrets.CONTENTFUL_ENV }}
      - name: Run Contentful Schema Tests
        if: always()
        run: npm run playwright:test-web:dev:contentful:allschemas
        env: 
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ENV: ${{ secrets.CONTENTFUL_ENVIRONMENT }}
          CONTENTFUL_MANAGEMENT_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}
      - name: Install Allure Commandline
        if: always()
        run: npm install -g allure-commandline --save-dev
      - name: Generate Allure report
        if: always()
        run: npx allure generate ./playwright/reports/api/allure-results --clean
          --output ./playwright/reports/api/allure-report
      #  - name: List files in the Allure directory
      #   if: always()
      #   run: ls -al
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: ./playwright/reports/api/allure-report
  host:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Download Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: ./playwright/reports
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright/reports
          publish_branch: gh-pages
          destination_dir: api
          keep_files: true
      - name: Create Allure Summary
        if: always()
        run: |
          node create-summary.js --platform=api
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
    
